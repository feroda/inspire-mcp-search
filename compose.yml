
services:

  ollama:
    image: ollama/ollama:0.34.2
    ports:
      - "${BIND_HOST}:${OLLAMA_PORT}:11434"
    environment:
      - OLLAMA_DEBUG=1
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - mynet

    # Runs on CPU by default so the stack starts anywhere.
    # Set USE_GPU=1 in .env to layer compose.gpu.yml on top.
    deploy:
      resources:
        limits:
          memory: 24G

  db:
    image: pgvector/pgvector:0.8.6-pg18
    env_file: .env
    volumes:
      - pg18:/var/lib/postgresql/
      - ./db/init/:/docker-entrypoint-initdb.d/:ro
    stop_signal: SIGINT
    restart: unless-stopped
    networks:
      - mynet
    ports:
      - "${BIND_HOST}:${POSTGRES_PORT}:5432"
    deploy:
      resources:
        limits:
          memory: 8G

  web:
    build: ./web/.
    env_file: .env
    user: "${DOCKER_UID}:${DOCKER_GID}"
    volumes:
      - ./web:/app
    command: python manage.py runserver 0.0.0.0:9001
    ports:
      - "${BIND_HOST}:${WEB_PORT}:9001"
    depends_on:
      - db
      - ollama
    stop_signal: SIGINT
    restart: unless-stopped
    networks:
      - mynet

volumes:
  pg18: {}
  ollama_data: {}


networks:
  mynet:
   ipam:
     config:
       - subnet: ${DOCKER_SUBNET}
